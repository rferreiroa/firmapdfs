[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firmapdfs"
version = "1.0.0"
description = "Document Automation System - Word processing, PDF export, and digital signing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "FirmaPDFs Team"}
]
keywords = ["pdf", "signing", "word", "automation", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "reportlab>=4.1.0",
    "cryptography>=41.0.0",
    "endesive>=2.17.0",
    "watchdog>=4.0.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
windows = [
    "pywin32>=306",
    "keyring>=25.0.0",
]

[project.scripts]
firmapdfs = "firmapdfs.cli:main"

[project.urls]
Homepage = "https://github.com/example/firmapdfs"
Documentation = "https://github.com/example/firmapdfs#readme"
Repository = "https://github.com/example/firmapdfs.git"
Issues = "https://github.com/example/firmapdfs/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
